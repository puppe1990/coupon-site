<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>OG · Cupom Vantagens</title>
    <style>
      @font-face {
        font-family: 'Instrument Sans';
        src: url('fonts/instrument-sans-400.woff2') format('woff2');
        font-weight: 400;
        font-style: normal;
        font-display: block;
      }
      @font-face {
        font-family: 'Instrument Sans';
        src: url('fonts/instrument-sans-500.woff2') format('woff2');
        font-weight: 500;
        font-style: normal;
        font-display: block;
      }
      @font-face {
        font-family: 'JetBrains Mono';
        src: url('fonts/jetbrains-mono.woff2') format('woff2');
        font-weight: 100 800;
        font-style: normal;
        font-display: block;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: #f5f0e6;
      }
      #og {
        width: 1200px;
        height: 630px;
        position: relative;
        overflow: hidden;
        background: #f5f0e6;
        color: #1f1b16;
        font-family: 'Instrument Sans', ui-sans-serif, system-ui, sans-serif;
      }
      .rule {
        position: absolute;
        left: 0;
        top: 0;
        bottom: 0;
        width: 4px;
        background: #146c43;
      }
      .frame {
        position: relative;
        z-index: 1;
        height: 630px;
        padding: 44px 52px 36px 56px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }
      .top,
      .foot,
      .kicker,
      .host,
      .code,
      .btn {
        font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, monospace;
      }
      .top {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        font-size: 13px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }
      .kicker {
        color: #146c43;
      }
      .host {
        color: #6b6255;
        letter-spacing: 0.08em;
        text-transform: none;
      }
      .body {
        display: grid;
        grid-template-columns: 1fr 380px;
        gap: 48px;
        align-items: center;
      }
      h1 {
        font-size: 72px;
        font-weight: 500;
        line-height: 0.94;
        letter-spacing: -0.03em;
        max-width: 8ch;
      }
      .lead {
        margin-top: 18px;
        max-width: 18ch;
        font-size: 24px;
        line-height: 1.3;
        color: #574e43;
      }
      .ticket {
        position: relative;
        background: #fffdf8;
        border: 1px solid rgba(31, 27, 22, 0.1);
        border-radius: 14px;
      }
      .ticket-body {
        padding: 28px 28px 24px;
      }
      .ticket-kicker {
        font-size: 13px;
        color: #6b6255;
      }
      .ticket-title {
        margin-top: 12px;
        font-size: 28px;
        font-weight: 500;
        letter-spacing: -0.02em;
        line-height: 1.15;
      }
      .ticket-who {
        margin-top: 8px;
        font-size: 16px;
        color: #574e43;
      }
      .stub {
        position: relative;
        background: #146c43;
        border-top: 1px dashed rgba(255, 253, 248, 0.45);
        border-radius: 0 0 13px 13px;
        padding: 18px 22px 18px 24px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
      }
      .stub::before,
      .stub::after {
        content: '';
        position: absolute;
        top: -10px;
        width: 20px;
        height: 20px;
        border-radius: 9999px;
        background: #f5f0e6;
      }
      .stub::before {
        left: -11px;
      }
      .stub::after {
        right: -11px;
      }
      .code {
        font-size: 16px;
        font-weight: 500;
        letter-spacing: 0.1em;
        color: #fffdf8;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        height: 36px;
        padding: 0 14px;
        border-radius: 8px;
        background: #fffdf8;
        color: #146c43;
        font-size: 13px;
        font-weight: 500;
        letter-spacing: 0.04em;
      }
      .foot {
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-size: 13px;
        letter-spacing: 0.04em;
        color: #6b6255;
      }
      .foot b {
        color: #146c43;
        font-weight: 400;
      }
    </style>
  </head>
  <body>
    <div id="og">
      <span class="rule" aria-hidden="true"></span>
      <div class="frame">
        <div class="top">
          <p class="kicker">Cupom · BR</p>
          <p class="host">cupom-vantagens.apps.gestaobem.com</p>
        </div>
        <div class="body">
          <div>
            <h1>Cupom Vantagens</h1>
            <p class="lead">Códigos de indicação para a primeira compra.</p>
          </div>
          <div class="ticket">
            <div class="ticket-body">
              <p class="ticket-kicker">Código de indicação</p>
              <p class="ticket-title">Primeira compra</p>
              <p class="ticket-who">Apps e lojas brasileiras</p>
            </div>
            <div class="stub">
              <span class="code">VANTAGENS</span>
              <span class="btn">Copiar</span>
            </div>
          </div>
        </div>
        <p class="foot">
          <span>17 códigos · validade e termos em cada oferta</span>
          <b>Copie e use no site da marca</b>
        </p>
      </div>
    </div>
  </body>
</html>
